name: mcp-context-forge

include:
  - path: ./contextforge/docker-compose.yml

services:
  add_mcp:
    build: ./mcps/add
    image: mcp-platform/add:local
    restart: unless-stopped
    networks: [mcpnet]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  register_add_mcp: &mcp_registration
    image: ${IMAGE_LOCAL:-mcpgateway/mcpgateway:latest}
    restart: "no"
    networks: [mcpnet]
    depends_on:
      gateway:
        condition: service_healthy
      add_mcp:
        condition: service_healthy
    environment: &registration_environment
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Run make setup in contextforge first}
      AUTH_ENCRYPTION_SECRET: ${AUTH_ENCRYPTION_SECRET:?Run make setup in contextforge first}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?Run make setup in contextforge first}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?Run make setup in contextforge first}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@example.com}
      JWT_ALGORITHM: HS256
      JWT_ISSUER: mcpgateway
      JWT_AUDIENCE: mcpgateway-api
      GATEWAY_URL: http://gateway:4444
      MCP_NAME: add-mcp
      MCP_URL: http://add_mcp:8001/mcp
      VIRTUAL_SERVER_NAME: Add MCP
    volumes:
      - ./mcps/register.py:/registration/register.py:ro
    entrypoint: [python, /registration/register.py]

  dates_mcp:
    build: ./mcps/dates
    image: mcp-platform/dates:local
    restart: unless-stopped
    networks: [mcpnet]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  register_dates_mcp:
    <<: *mcp_registration
    depends_on:
      gateway:
        condition: service_healthy
      dates_mcp:
        condition: service_healthy
    environment:
      <<: *registration_environment
      MCP_NAME: dates-mcp
      MCP_URL: http://dates_mcp:8001/mcp
      VIRTUAL_SERVER_NAME: Dates MCP
      VIRTUAL_SERVER_DESCRIPTION: Date calculation MCP tools
